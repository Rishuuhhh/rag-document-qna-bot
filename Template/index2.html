<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Question and Answer</title>

    <style>
        :root {
            --blue: #007BA7;
            --black: #0A0A0A;
            --pink: #FF2D95;
            --panel: #17191b;
            --border: #34383b;
            --muted: #a8afb4;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 32px 16px;
            display: grid;
            place-items: center;
            background: var(--black);
            color: #f2f2f2;
            font-family: Arial, Helvetica, sans-serif;
        }

        main {
            width: min(100%, 620px);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 30px;
            font-weight: 650;
            letter-spacing: -0.6px;
        }

        .description {
            margin: 0 0 26px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.5;
        }

        form {
            padding: 26px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-top: 3px solid var(--blue);
            border-radius: 8px;
        }

        .field {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .hint {
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 12px;
        }

        input[type="file"],
        input[type="text"] {
            width: 100%;
            min-height: 44px;
            padding: 10px 12px;
            color: #f2f2f2;
            background: var(--black);
            border: 1px solid var(--border);
            border-radius: 5px;
            font: inherit;
        }

        input[type="file"] {
            padding: 9px;
        }

        input[type="file"]::file-selector-button {
            margin-right: 10px;
            padding: 7px 10px;
            color: #fff;
            background: var(--blue);
            border: 0;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="text"]::placeholder {
            color: #858c91;
        }

        input:focus {
            outline: 2px solid var(--pink);
            outline-offset: 2px;
        }

        button {
            width: 100%;
            min-height: 44px;
            padding: 10px 16px;
            color: #fff;
            background: var(--blue);
            border: 0;
            border-radius: 5px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            background: #00658a;
        }

        button:focus-visible {
            outline: 2px solid var(--pink);
            outline-offset: 3px;
        }

        button:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 14px;
            }

            form {
                padding: 20px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>Ask a question about a PDF</h1>
        <p class="description">
            Choose a document, enter a question, and the our bot will look for an answer in its text.
        </p>

        <form id="questionForm" method="POST" action="/upload"
              enctype="multipart/form-data">
            <div class="field">
                <label for="pdfFile">PDF document</label>
                <input
                    type="file"
                    id="pdfFile"
                    name="pdfFile"
                    accept=".pdf,application/pdf"
                    required
                >
                <p class="hint">PDF files only. Maximum size: 16 MB.</p>
            </div>

            <div class="field">
                <label for="textInput">Your question</label>
                <input
                    type="text"
                    id="textInput"
                    name="textInput"
                    placeholder="For example: What is the main conclusion?"
                    required
                >
            </div>

            <button id="submitButton" type="submit">Get answer</button>
        </form>
    </main>

    <script>
        const form = document.getElementById("questionForm");
        const button = document.getElementById("submitButton");

        form.addEventListener("submit", () => {
            button.disabled = true;
            button.textContent = "Reading the PDF…";
        });
    </script>
</body>
</html>
